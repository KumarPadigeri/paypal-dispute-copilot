[project]
name = "dispute-copilot"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Browser tests need a built web page and a browser: run them with `pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests (Playwright)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
